# E1: the default of Arch sections 2 to 4 at 512 px, five folds, training seed 1 (A6).  Baseline and, with E1b, the noise floor.
base_config: base.yaml
experiment: E1

train:
  resolution: 512
  seed: 1

# D-e (Gate 1 review, 2026-10-12): learning-rate check on the 512 px baseline, grid {3e-5, 1e-4, 3e-4, 1e-3} (1e-3 added
# after the Gate 1 overfit check, which showed optimisation speed, not generalisation).  The check has been run
# (configs/e1_lrcheck.yaml: fold 0, 7,000 steps, protocol Q12) and adopted 1e-3 (reviewer, 2026-10-17): the optimiser lr
# of this config is the one in base.yaml (1e-3 when E1 and E1b first ran; see DECISIONS.md).
# The block below is the record of the finished check and keeps its values;
# lr_check.default is the reference of that check, not the lr this config trains with.
lr_check:
  default: 1.0e-4
  grid: [3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
